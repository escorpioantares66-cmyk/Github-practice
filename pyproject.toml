[project]
name = "github-practice"
version = "0.4.0"
description = "SDK and CLI for users"
requires-python = ">=3.9"
dependencies = ["requests"]

[project.scripts]
practice-cli = "stage3_cli.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stage2_sdk*", "stage3_cli*"]
